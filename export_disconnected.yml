---
# export_disconnected.yml
#
# Runs the Pulp library export and pulls satellite-side artifacts into the
# provisioner staging directory for the lowside disconnected export bundle.
# Called by export_deployment.sh from inside the rhis-provisioner container.
#
# Pulp export chunks remain where Satellite places them:
#   /var/lib/pulp/exports/<org>/<version>/<hostname>/<timestamp>/
#
# Satellite-sourced artifacts (ansible_roles, discovery_images) are pulled
# from the satellite directly to the provisioner staging directory mounted
# at /rhis/vars/export_staging/satellite/.
#
# All other staging (containers, inventory archive, bootstrap, ISOs) is handled
# by export_deployment.sh in bash after this playbook completes.
#
# REQUIRED MOUNTS (enforced by export_deployment.sh):
#   /rhis/vars/highside_host_vars  — highside deployment host_vars/ directory
#                                    Required for writing content_imports.yml (C6).
#                                    deployments/<highside_domain>/host_vars/ on host.
#   /rhis/vars/export_staging      — provisioner staging directory for this export run.
#                                    Created by export_deployment.sh before Stage 1.
#
# REQUIRED EXTRA VARS:
#   active_downstream_deployment   — FQDN of the target highside domain (e.g. highside.example.ca)

- name: "Satellite Pulp export and artifact collection"
  hosts: sat_primary
  become: true
  gather_facts: true

  vars:
    _ansible_roles_src: "/etc/ansible/roles"
    _ansible_playbooks_src: "/etc/ansible/playbooks"
    _discovery_image_dir: "/var/lib/tftpboot/boot"
    _export_staging: "/rhis/vars/export_staging"

  tasks:

    - name: "Load vault variables"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"
      tags: always

    - name: "Load other variables"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"
      tags: always

    # ── Pre: Gather enabled sync plans before export ───────────────────────
    # Gathered outside the block so _enabled_sync_plans is always available
    # in the always section for re-enable, even on failure.

    - name: "Pre — Gather currently enabled sync plans"
      redhat.satellite.resource_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
        server_url: "{{ satellite_url }}"
        organization: "{{ satellite_organization }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        resource: sync_plans
        search: "enabled = true"
      register: _enabled_sync_plans
      tags:
        - tags_content_exports

    - name: "Pre — Disable sync plans for export"
      redhat.satellite.sync_plan:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
        server_url: "{{ satellite_url }}"
        organization: "{{ satellite_organization }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        name: "{{ _sync_plan.name }}"
        interval: "{{ _sync_plan.interval }}"
        sync_date: "{{ _sync_plan.sync_date }}"
        enabled: false
        state: present
      loop: "{{ _enabled_sync_plans.resources }}"
      loop_control:
        loop_var: _sync_plan
        label: "{{ _sync_plan.name }}"
      tags:
        - tags_content_exports

    - name: "Export — run content export and collect artifacts"
      block:

        # ── Pre: Reset Pulp export marker for fresh run ──────────────────────
        # Tagged tags_content_exports so this is skipped during --skip-tags resume,
        # preserving the marker for downstream reference.

        - name: "Pre — Remove stale Pulp export marker"
          ansible.builtin.file:
            path: "/rhis/vars/logs/.pulp_export_complete"
            state: absent
          delegate_to: localhost
          connection: local
          tags:
            - tags_content_exports

        # ── Step 1: Content export ────────────────────────────────────────────

        - name: "Step 1 — Run content_exports role (Library)"
          ansible.builtin.import_role:
            name: content_exports
          tags:
            - tags_content_config
            - tags_content_exports

        - name: "Resolve Pulp export root"
          ansible.builtin.set_fact:
            _pulp_export_root: "/var/lib/pulp/exports/{{ content_exports[0].destination_server | default('') }}"

        - name: "Show Pulp export root"
          ansible.builtin.debug:
            msg: "Pulp export root: {{ _pulp_export_root }}"

        # ── Step 2: Pull Ansible roles from satellite to provisioner staging ─
        # Uses tar/fetch/unarchive rather than synchronize — synchronize spawns
        # its own rsync SSH subprocess that does not inherit the Ansible private
        # key, causing a password prompt in the container context.

        - name: "Step 2 — Check for Ansible roles on satellite"
          ansible.builtin.stat:
            path: "{{ _ansible_roles_src }}"
          register: _roles_stat

        - name: "Step 2 — Archive Ansible roles on satellite"  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "tar czf /tmp/ansible_roles_export.tar.gz -C {{ _ansible_roles_src }} ."
          when: _roles_stat.stat.exists
          changed_when: true

        - name: "Step 2 — Fetch Ansible roles archive to staging"
          ansible.builtin.fetch:
            src: /tmp/ansible_roles_export.tar.gz
            dest: "{{ _export_staging }}/satellite/"
            flat: true
          when: _roles_stat.stat.exists

        - name: "Step 2 — Extract Ansible roles to staging"
          ansible.builtin.unarchive:
            src: "{{ _export_staging }}/satellite/ansible_roles_export.tar.gz"
            dest: "{{ _export_staging }}/satellite/ansible_roles/"
            remote_src: false
          delegate_to: localhost
          connection: local
          when: _roles_stat.stat.exists

        - name: "Step 2 — Remove Ansible roles archive from satellite"
          ansible.builtin.file:
            path: /tmp/ansible_roles_export.tar.gz
            state: absent
          when: _roles_stat.stat.exists

        - name: "Step 2 — Check for Ansible playbooks on satellite"
          ansible.builtin.stat:
            path: "{{ _ansible_playbooks_src }}"
          register: _playbooks_stat

        - name: "Step 2 — Archive Ansible playbooks on satellite"  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "tar czf /tmp/ansible_playbooks_export.tar.gz -C {{ _ansible_playbooks_src }} ."
          when: _playbooks_stat.stat.exists
          changed_when: true

        - name: "Step 2 — Fetch Ansible playbooks archive to staging"
          ansible.builtin.fetch:
            src: /tmp/ansible_playbooks_export.tar.gz
            dest: "{{ _export_staging }}/satellite/"
            flat: true
          when: _playbooks_stat.stat.exists

        - name: "Step 2 — Ensure playbooks staging directory exists"
          ansible.builtin.file:
            path: "{{ _export_staging }}/satellite/ansible_roles/playbooks/"
            state: directory
            mode: "0755"
          delegate_to: localhost
          connection: local
          when: _playbooks_stat.stat.exists

        - name: "Step 2 — Extract Ansible playbooks to staging"
          ansible.builtin.unarchive:
            src: "{{ _export_staging }}/satellite/ansible_playbooks_export.tar.gz"
            dest: "{{ _export_staging }}/satellite/ansible_roles/playbooks/"
            remote_src: false
          delegate_to: localhost
          connection: local
          when: _playbooks_stat.stat.exists

        - name: "Step 2 — Remove Ansible playbooks archive from satellite"
          ansible.builtin.file:
            path: /tmp/ansible_playbooks_export.tar.gz
            state: absent
          when: _playbooks_stat.stat.exists

        - name: "Step 2 — Warn if no Ansible roles found"
          when: not _roles_stat.stat.exists
          ansible.builtin.debug:
            msg: >
              WARNING: {{ _ansible_roles_src }} not found on satellite.
              Ansible roles will not be in the export staging.

        # ── Step 3: Pull Foreman discovery images from satellite to staging ──
        # Uses scp via command+delegate_to — one connection per file, direct to staging.
        # ansible.builtin.fetch falls back to the slurp path under become:true, which
        # base64-encodes the binary in Python and pegs CPU.  bundle+unarchive fails
        # because unarchive makes a temp copy inside the container overlay filesystem
        # which has no room for a 500 MB file.  scp bypasses both problems.

        - name: "Step 3 — Find Foreman discovery images on satellite"
          ansible.builtin.find:
            paths: "{{ _discovery_image_dir }}"
            patterns: "fdi-image-*.tar"
            file_type: file
          register: _discovery_images

        - name: "Step 3 — Copy discovery images to staging via scp"
          ansible.builtin.command:
            cmd: >-
              scp -q
              -o BatchMode=yes
              -o StrictHostKeyChecking=no
              -i /root/.ssh/id_ed25519
              ansiblerunner@{{ inventory_hostname }}:{{ item.path }}
              {{ _export_staging }}/satellite/discovery_images/{{ item.path | basename }}
          delegate_to: localhost
          connection: local
          loop: "{{ _discovery_images.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          when: _discovery_images.files | length > 0
          changed_when: true

        - name: "Step 3 — Warn if no discovery images found"
          when: _discovery_images.files | length == 0
          ansible.builtin.debug:
            msg: >
              WARNING: No Foreman discovery images found in {{ _discovery_image_dir }}.
              Foreman discovery will need images from the Satellite DVD on the highside.

        # ── Step 4: Record lowside versions for manifest ─────────────────────
        # Written to a sidecar in provisioner staging; export_deployment.sh reads it
        # when assembling rhis_export_manifest.yml so the highside can validate
        # version compatibility before running pulpcore-worker.

        - name: "Step 4 — Gather package facts from satellite"
          ansible.builtin.package_facts:
            manager: rpm
          tags:
            - tags_content_exports

        - name: "Step 4 — Write export version facts to staging"
          ansible.builtin.copy:
            content: |
              satellite_version: "{{ (ansible_facts.packages['satellite'] | default([{'version': 'unknown'}]))[0].version }}"
              pulpcore_version: "{{ (ansible_facts.packages['python3-pulpcore'] | default([{'version': 'unknown'}]))[0].version }}"
              pulp_rpm_version: "{{ (ansible_facts.packages['python3-pulp-rpm'] | default([{'version': 'unknown'}]))[0].version }}"
              pulp_file_version: "{{ (ansible_facts.packages['python3-pulp-file'] | default([{'version': 'unknown'}]))[0].version }}"
            dest: "{{ _export_staging }}/_version_facts.yml"
            mode: "0644"
          delegate_to: localhost
          connection: local
          tags:
            - tags_content_exports

      always:

        # ── Checkpoint: Recovery and completion marker ───────────────────────
        # In always so it fires even when the content_exports module fails
        # (e.g. 502 from Apache while polling a Pulp task that actually completed).
        # When _export_path is not set (module failure), we query the Foreman
        # task to verify the export actually completed (result != error) before
        # attempting disk-based recovery.

        # Gate: query the Foreman task result before attempting recovery.
        # A 'warning' result means the export completed with non-fatal issues
        # (e.g. container API 502). An 'error' result means genuine failure.
        - name: "Checkpoint — Query Foreman task result for most recent export"
          ansible.builtin.uri:
            url: >-
              {{ satellite_url }}/foreman_tasks/api/tasks?search={{
              'label = Actions::Pulp3::Orchestration::ContentViewVersion::ExportLibrary and state = stopped'
              | urlencode }}&order={{ 'started_at DESC' | urlencode }}&per_page=1
            method: GET
            url_username: "{{ satellite_username | default(omit) }}"
            url_password: "{{ satellite_password | default(omit) }}"
            force_basic_auth: true
            validate_certs: "{{ satellite_validate_certs | default(false) }}"
          register: _recovery_task_info
          failed_when: false
          when: _export_path is not defined or _export_path | default('') | length == 0
          tags:
            - tags_content_exports

        - name: "Checkpoint — Set recovery eligibility from task result"
          ansible.builtin.set_fact:
            _recovery_task_result: "{{ _recovery_task_info.json.results[0].result | default('unknown') }}"
            _recovery_eligible: >-
              {{ _recovery_task_info.json.results | default([]) | length > 0
                 and _recovery_task_info.json.results[0].result in ['warning', 'success'] }}
          when:
            - _export_path is not defined or _export_path | default('') | length == 0
            - _recovery_task_info is defined
            - _recovery_task_info.status | default(0) == 200
          tags:
            - tags_content_exports

        - name: "Checkpoint — Log recovery decision"
          ansible.builtin.debug:
            msg: >-
              Foreman export task result: {{ _recovery_task_result | default('unknown') }}.
              Recovery eligible: {{ _recovery_eligible | default(false) }}.
          when:
            - _recovery_task_info is defined
            - _recovery_task_info.status | default(0) == 200
          tags:
            - tags_content_exports

        - name: "Checkpoint — Block recovery on genuine export failure"
          ansible.builtin.debug:
            msg: >-
              Export task result is '{{ _recovery_task_result | default('unknown') }}' —
              this is a genuine failure, not a transient API error.
              Checkpoint recovery skipped. Investigate the failure and re-run.
          when:
            - _export_path is not defined or _export_path | default('') | length == 0
            - not (_recovery_eligible | default(false) | bool)
          tags:
            - tags_content_exports

        - name: "Checkpoint — Discover export path from disk (recovery)"
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              find /var/lib/pulp/exports/ -name '*-toc.json' -printf '%T@ %h\n' 2>/dev/null
              | sort -rn | head -1 | awk '{print $2}'
            executable: /bin/bash
          register: _discovered_path
          changed_when: false
          failed_when: false
          when:
            - _export_path is not defined or _export_path | default('') | length == 0
            - _recovery_eligible | default(false) | bool
          tags:
            - tags_content_exports

        - name: "Checkpoint — Set _export_path from disk discovery"
          ansible.builtin.set_fact:
            _export_path: "{{ _discovered_path.stdout | trim }}"
          when:
            - _export_path is not defined or _export_path | default('') | length == 0
            - _discovered_path.stdout | default('') | trim | length > 0
          tags:
            - tags_content_exports

        - name: "Checkpoint — Log recovered export path"
          ansible.builtin.debug:
            msg: "Recovery: discovered export path from disk: {{ _export_path }}"
          when:
            - _discovered_path is defined
            - _discovered_path.stdout | default('') | trim | length > 0
          tags:
            - tags_content_exports

        - name: "Checkpoint — Find tar chunks in export directory"
          ansible.builtin.find:
            paths: "{{ _export_path }}"
            patterns: "*.tar.*"
            file_type: file
          register: _export_tar_files
          when:
            - _export_path is defined
            - _export_path | length > 0
          tags:
            - tags_content_exports

        - name: "Checkpoint — Find toc.json in export directory"
          ansible.builtin.find:
            paths: "{{ _export_path }}"
            patterns: "*-toc.json"
            file_type: file
          register: _export_toc_files
          when:
            - _export_path is defined
            - _export_path | length > 0
          tags:
            - tags_content_exports

        # Verify that every file listed in the toc.json manifest exists on
        # disk and no extra tar chunks are present.  This is the same check
        # the import side performs before ingesting the bundle.
        - name: "Checkpoint — Verify toc.json manifest matches disk contents"
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              toc_files=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1]));
              print('\n'.join(sorted(d.get('files',{}).keys())))" "{{ _export_toc_files.files[0].path }}");
              disk_files=$(ls -1 "{{ _export_path }}/" | grep '\.tar\.' | sort);
              if [ "$toc_files" = "$disk_files" ]; then
                count=$(echo "$toc_files" | wc -l);
                echo "VERIFIED: $count files match";
                exit 0;
              else
                echo "MISMATCH";
                echo "toc: $(echo "$toc_files" | wc -l) files";
                echo "disk: $(echo "$disk_files" | wc -l) files";
                diff <(echo "$toc_files") <(echo "$disk_files") || true;
                exit 1;
              fi
            executable: /bin/bash
          register: _toc_verification
          changed_when: false
          failed_when: false
          when:
            - _export_path is defined
            - _export_path | length > 0
            - _export_toc_files.matched | default(0) > 0
            - _export_tar_files.matched | default(0) > 0
          tags:
            - tags_content_exports

        - name: "Checkpoint — Log toc.json verification result"
          ansible.builtin.debug:
            msg: "{{ _toc_verification.stdout | default('verification skipped') }}"
          when:
            - _toc_verification is defined
            - _toc_verification is not skipped
          tags:
            - tags_content_exports

        - name: "Checkpoint — Stat metadata.json in export directory"
          ansible.builtin.stat:
            path: "{{ _export_path }}/metadata.json"
          register: _export_metadata_stat
          when:
            - _export_path is defined
            - _export_path | length > 0
          tags:
            - tags_content_exports

        # Recovery: if toc.json exists (Pulp completed) but metadata.json is
        # missing (hammer generate-metadata never ran), query the export history
        # and generate it now.
        - name: "Checkpoint — Query export history for recovery"
          redhat.satellite.resource_info:
            username: "{{ satellite_username | default(omit) }}"
            password: "{{ satellite_password | default(omit) }}"
            use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
            server_url: "{{ satellite_url }}"
            organization: "{{ satellite_organization }}"
            validate_certs: "{{ satellite_validate_certs | default(omit) }}"
            resource: content_exports
          register: _recovery_export_history_raw
          failed_when: false
          when:
            - _export_path is defined
            - _export_path | length > 0
            - _export_toc_files.matched | default(0) > 0
            - not (_export_metadata_stat.stat.exists | default(false))
          tags:
            - tags_content_exports

        - name: "Checkpoint — Match export history to discovered path"
          ansible.builtin.set_fact:
            _recovery_export_match: >-
              {{ _recovery_export_history_raw.resources
                 | selectattr('path', 'eq', _export_path)
                 | list }}
          when:
            - _recovery_export_history_raw is defined
            - _recovery_export_history_raw.resources | default([]) | length > 0
            - not (_export_metadata_stat.stat.exists | default(false))
          tags:
            - tags_content_exports

        - name: "Checkpoint — Generate metadata.json (recovery)"
          ansible.builtin.command:
            cmd: "hammer content-export generate-metadata --id {{ _recovery_export_match[0].id }}"
          when:
            - _recovery_export_match is defined
            - _recovery_export_match | default([]) | length > 0
            - not (_export_metadata_stat.stat.exists | default(false))
          changed_when: true
          failed_when: false
          register: _recovery_metadata_result
          tags:
            - tags_content_exports

        - name: "Checkpoint — Re-stat metadata.json after recovery"
          ansible.builtin.stat:
            path: "{{ _export_path }}/metadata.json"
          register: _export_metadata_stat
          when:
            - _recovery_metadata_result is defined
            - _recovery_metadata_result.rc | default(1) == 0
          tags:
            - tags_content_exports

        # ── Recovery: generate content_imports.yml ──────────────────────────
        # When the export module timed out but Pulp completed, the normal
        # generate_content_imports_file.yml (called after the module in
        # perform_library_export.yml) was skipped. Without this recovery,
        # Stage 3 of export_deployment.yml falls back to the static
        # placeholder in highside host_vars — wrong path.

        - name: "Checkpoint — Stat content_imports.yml in staging"
          ansible.builtin.stat:
            path: "{{ _export_staging }}/satellite/content_imports.yml"
          register: _recovery_ci_stat
          delegate_to: localhost
          connection: local
          when:
            - _export_path is defined
            - _export_path | length > 0
          tags:
            - tags_content_exports

        - name: "Checkpoint — Build content_imports.yml (recovery)"
          vars:
            _import_path: "{{ _export_path | replace('/var/lib/pulp/exports/', '/var/lib/pulp/imports/') }}"
          ansible.builtin.set_fact:
            _recovery_ci_content: |
              ---
              # content_imports.yml
              # Auto-generated by export_disconnected.yml recovery on {{ ansible_date_time.iso8601 }}
              # Source satellite: {{ ansible_fqdn }}

              satellite_import_content: true

              content_imports:
              {% for ce in content_exports %}
                - name: "{{ ce.name }}"
                  type: "{{ ce.type }}"
                  import_path: "{{ _import_path }}"
                  metadata_file: "{{ _import_path }}/metadata.json"
              {% endfor %}
          when:
            - _export_path is defined
            - _export_path | length > 0
            - not (_recovery_ci_stat.stat.exists | default(false))
          tags:
            - tags_content_exports

        - name: "Checkpoint — Ensure satellite staging directory exists"
          ansible.builtin.file:
            path: "{{ _export_staging }}/satellite"
            state: directory
            mode: "0755"
          delegate_to: localhost
          connection: local
          when:
            - _recovery_ci_content is defined
          tags:
            - tags_content_exports

        - name: "Checkpoint — Write content_imports.yml to staging (recovery)"
          ansible.builtin.copy:
            content: "{{ _recovery_ci_content }}"
            dest: "{{ _export_staging }}/satellite/content_imports.yml"
            mode: "0644"
          delegate_to: localhost
          connection: local
          when:
            - _recovery_ci_content is defined
          tags:
            - tags_content_exports

        - name: "Checkpoint — Write content_imports.yml to satellite export path (recovery)"
          ansible.builtin.copy:
            content: "{{ _recovery_ci_content }}"
            dest: "{{ _export_path }}/content_imports.yml"
            mode: "0644"
          when:
            - _recovery_ci_content is defined
          tags:
            - tags_content_exports

        - name: "Checkpoint — Log content_imports.yml recovery"
          ansible.builtin.debug:
            msg: >-
              Recovery: generated content_imports.yml from recovered export path.
              Import path: {{ _export_path | replace('/var/lib/pulp/exports/', '/var/lib/pulp/imports/') }}
          when:
            - _recovery_ci_content is defined
          tags:
            - tags_content_exports

        - name: "Checkpoint — Write Pulp export completion marker"
          ansible.builtin.copy:
            content: |
              export_timestamp: "{{ ansible_date_time.iso8601 }}"
              pulp_export_path: "{{ _export_path }}"
            dest: "/rhis/vars/logs/.pulp_export_complete"
            mode: "0644"
          delegate_to: localhost
          connection: local
          when:
            - _export_path is defined
            - _export_path | length > 0
            - _export_tar_files.matched | default(0) > 0
            - _export_toc_files.matched | default(0) > 0
            - _toc_verification.rc | default(1) == 0
          tags:
            - tags_content_exports

        - name: "Checkpoint — Warn if export directory incomplete"
          ansible.builtin.debug:
            msg: >-
              WARNING: Export directory {{ _export_path | default('(not set)') }} is incomplete
              (tar chunks: {{ _export_tar_files.matched | default(0) }},
              toc.json: {{ _export_toc_files.matched | default(0) }},
              toc verified: {{ _toc_verification.rc | default(1) == 0 }},
              metadata.json: {{ _export_metadata_stat.stat.exists | default(false) }}).
              Completion marker not written — next run will perform a full export.
          when:
            - _export_path is defined
            - _export_path | length > 0
            - (_export_tar_files.matched | default(0)) == 0 or
              (_export_toc_files.matched | default(0)) == 0 or
              (_toc_verification.rc | default(1)) != 0
          tags:
            - tags_content_exports

        # ── Post: Re-enable sync plans ───────────────────────────────────────
        # Runs on success and failure. Guarded by _enabled_sync_plans being defined
        # so a --skip-tags tags_content_exports resume run is a clean no-op here.

        - name: "Post — Re-enable sync plans"
          when: _enabled_sync_plans is defined
          redhat.satellite.sync_plan:
            username: "{{ satellite_username | default(omit) }}"
            password: "{{ satellite_password | default(omit) }}"
            use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
            server_url: "{{ satellite_url }}"
            organization: "{{ satellite_organization }}"
            validate_certs: "{{ satellite_validate_certs | default(omit) }}"
            name: "{{ _sync_plan.name }}"
            interval: "{{ _sync_plan.interval }}"
            sync_date: "{{ _sync_plan.sync_date }}"
            enabled: true
            state: present
          loop: "{{ _enabled_sync_plans.resources | default([]) }}"
          loop_control:

---
# export_disconnected.yml
#
# Orchestrates the lowside disconnected satellite export bundle assembly.
# Called by build_sat_disconnected_export.sh from inside the rhis-provisioner container.
#
# The Pulp library export chunks remain exactly where Satellite placed them:
#   /var/lib/pulp/exports/<destination_server>/<org>/Library/<version>/
#
# All additional bundle artifacts are staged in rhis_export_root on the satellite,
# in a separate directory with no SELinux context concerns:
#   <rhis_export_root>/<destination_server>_<timestamp>/
#
# The copy_rhis_to_transfer_media.sh script (Stage 2) assembles both locations
# onto transfer media in a single operator action.

- name: "Assemble disconnected satellite export bundle"
  hosts: sat_primary
  become: true
  gather_facts: true

  vars:
    rhis_export_root: "/home/ansiblerunner/rhis_export"
    rhis_provisioner_image: "quay.io/parmstro/rhis-provisioner-9-2.5:latest"
    _bundle_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}"
    _manifests_src: "files/manifests"
    _ansible_roles_src: "/etc/ansible/roles"
    _ansible_playbooks_src: "/etc/ansible/playbooks"
    _discovery_image_dir: "/var/lib/tftpboot/boot"
    _baremetal_init_src: "/home/ansiblerunner/rhis/rhis-builder-baremetal-init"

  tasks:

    - name: "Load vault variables"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"
      tags: always

    - name: "Load other variables"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"
      tags: always

    # ── Pre: Mount transfer drive ───────────────────────────────────────────

    - name: "Pre — Prepare export drive"
      ansible.builtin.import_role:
        name: content_export_prepare_drv
      vars:
        content_export_prepare_drv_state: "present"
      tags:
        - tags_export_drive
        - tags_content_exports

    # ── Step 1: Content export ──────────────────────────────────────────────

    - name: "Step 1 — Run content_exports role (Library)"
      ansible.builtin.import_role:
        name: content_exports
      tags:
        - tags_content_config
        - tags_content_exports

    # Resolve the Pulp export path from the export result and destination_server
    - name: "Resolve bundle destination name"
      ansible.builtin.set_fact:
        _destination_server: "{{ content_exports[0].destination_server }}"
        _bundle_dir: "{{ rhis_export_root }}/{{ content_exports[0].destination_server }}_{{ _bundle_timestamp }}"
        _pulp_export_root: "/var/lib/pulp/exports/{{ content_exports[0].destination_server }}"

    - name: "Show bundle staging directory"
      ansible.builtin.debug:
        msg:
          - "Bundle directory: {{ _bundle_dir }}"
          - "Pulp export root: {{ _pulp_export_root }}"

    # ── Step 2: Create bundle staging directories ───────────────────────────

    - name: "Step 2 — Create bundle staging directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "ansiblerunner"
        group: "ansiblerunner"
      loop:
        - "{{ rhis_export_root }}"
        - "{{ _bundle_dir }}"
        - "{{ _bundle_dir }}/ansible_roles"
        - "{{ _bundle_dir }}/baremetal_init"
        - "{{ _bundle_dir }}/discovery_images"
        - "{{ _bundle_dir }}/manifests"
        - "{{ _bundle_dir }}/inventory"
        - "{{ _bundle_dir }}/container"

    # ── Step 3: Sync compliance-as-code Ansible roles ──────────────────────

    - name: "Step 3 — Sync Ansible roles to bundle"
      ansible.posix.synchronize:
        src: "{{ _ansible_roles_src }}/"
        dest: "{{ _bundle_dir }}/ansible_roles/"
        recursive: true
        delete: false
        mode: push

    - name: "Step 3 — Check for Ansible playbooks directory"
      ansible.builtin.stat:
        path: "{{ _ansible_playbooks_src }}"
      register: _playbooks_stat

    - name: "Step 3 — Sync Ansible playbooks to bundle"
      when: _playbooks_stat.stat.exists
      ansible.posix.synchronize:
        src: "{{ _ansible_playbooks_src }}/"
        dest: "{{ _bundle_dir }}/ansible_roles/playbooks/"
        recursive: true
        delete: false
        mode: push

    # ── Step 3b: Copy rhis-builder-baremetal-init ──────────────────────────
    # Provides the highside operator with tooling to generate kickstart ISOs
    # for unattended RHEL installs on bare metal or VMware (upload ISO to vCenter).
    # Required on the highside before IdM and Satellite nodes can be provisioned.

    - name: "Step 3b — Check for rhis-builder-baremetal-init"
      ansible.builtin.stat:
        path: "{{ _baremetal_init_src }}"
      register: _baremetal_init_stat
      delegate_to: localhost
      connection: local

    - name: "Step 3b — Sync rhis-builder-baremetal-init to bundle"
      when: _baremetal_init_stat.stat.exists
      ansible.posix.synchronize:
        src: "{{ _baremetal_init_src }}/"
        dest: "{{ _bundle_dir }}/baremetal_init/"
        recursive: true
        delete: false
        mode: push
        rsync_opts:
          - "--exclude=.git"

    - name: "Step 3b — Warn if rhis-builder-baremetal-init not found"
      when: not _baremetal_init_stat.stat.exists
      ansible.builtin.debug:
        msg: >
          WARNING: rhis-builder-baremetal-init not found at {{ _baremetal_init_src }}.
          The highside operator will not have kickstart ISO tooling in the bundle.
          Clone the repo to {{ _baremetal_init_src }} before running the export.

    # ── Step 4: Copy Foreman discovery images ──────────────────────────────

    - name: "Step 4 — Find Foreman discovery images"
      ansible.builtin.find:
        paths: "{{ _discovery_image_dir }}"
        patterns: "foreman*"
        file_type: file
      register: _discovery_images

    - name: "Step 4 — Copy discovery images to bundle"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ _bundle_dir }}/discovery_images/"
        remote_src: true
        mode: "0644"
      loop: "{{ _discovery_images.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: "Step 4 — Warn if no discovery images found"
      when: _discovery_images.files | length == 0
      ansible.builtin.debug:
        msg: "WARNING: No Foreman discovery images found in {{ _discovery_image_dir }}."

    # ── Step 5: Copy highside subscription manifests ────────────────────────

    - name: "Step 5 — Find highside manifests"
      ansible.builtin.find:
        paths: "{{ _manifests_src }}"
        patterns: "*.zip"
      register: _manifests
      delegate_to: localhost
      connection: local

    - name: "Step 5 — Copy highside manifests to bundle"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ _bundle_dir }}/manifests/{{ item.path | basename }}"
        mode: "0644"
      loop: "{{ _manifests.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: "Step 5 — Warn if no manifests found"
      when: _manifests.files | length == 0
      ansible.builtin.debug:
        msg: >
          WARNING: No manifest ZIP files found in {{ _manifests_src }}.
          Copy highside subscription manifests to files/manifests/ before transfer.

    # ── Step 6: Archive the inventory ──────────────────────────────────────
    # Two-step: archive locally on the controller, then copy to satellite.
    # The archive module runs on the controller (provisioner container) so dest
    # must be a local path. A subsequent copy pushes it to the satellite bundle.

    - name: "Step 6 — Create inventory archive on controller"
      community.general.archive:
        path: "{{ inventory_dir | default('/rhis/vars') }}"
        dest: "/tmp/rhis_inventory_{{ _bundle_timestamp }}.tar.gz"
        format: gz
        mode: "0644"
      delegate_to: localhost
      connection: local

    - name: "Step 6 — Copy inventory archive to satellite bundle"
      ansible.builtin.copy:
        src: "/tmp/rhis_inventory_{{ _bundle_timestamp }}.tar.gz"
        dest: "{{ _bundle_dir }}/inventory/rhis_inventory_{{ _bundle_timestamp }}.tar.gz"
        mode: "0644"

    # ── Step 7: Save the rhis-provisioner container image ──────────────────
    # Two-step: save image locally on the controller, then copy to satellite.

    # Step 7: Save container image on the provisioner host (not inside the container).
    # podman lives on the host running the provisioner container, not inside it.
    # delegate_to the provisioner group host to SSH into the host where podman runs.
    # Step 7: Container image save — aspirational (C10).
    # Requires running from outside the provisioner container (host SSH access to self
    # is unavailable from rootless podman network namespace). This step is non-fatal
    # and will warn if it cannot complete. The image must be transferred manually
    # or via a host-level orchestration step outside the container.
    - name: "Step 7 — Save rhis-provisioner container image on provisioner host" # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >
          podman save {{ rhis_provisioner_image }}
          -o /tmp/rhis-provisioner_{{ _bundle_timestamp }}.tar
      delegate_to: "{{ groups['provisioner_host'][0] }}"
      register: _podman_save
      changed_when: _podman_save.rc | default(1) == 0
      ignore_errors: true
      ignore_unreachable: true

    - name: "Step 7 — Warn if container image save was not possible"
      when: _podman_save.rc | default(-1) != 0
      ansible.builtin.debug:
        msg:
          - "WARNING: Container image save could not be completed automatically."
          - "Save manually on the provisioner host before transferring:"
          - "  podman save {{ rhis_provisioner_image }} -o <bundle>/container/rhis-provisioner.tar"

    - name: "Step 7 — Copy container image to satellite bundle"
      when: _podman_save.rc | default(-1) == 0
      ansible.builtin.copy:
        src: "/tmp/rhis-provisioner_{{ _bundle_timestamp }}.tar"
        dest: "{{ _bundle_dir }}/container/rhis-provisioner_{{ _bundle_timestamp }}.tar"
        mode: "0644"

    # ── Step 8: (Removed) ──────────────────────────────────────────────────
    #
    # Git SHA collection per role was removed. Rationale:
    #
    # The operator is responsible for ensuring /etc/ansible/roles/ contains
    # what they tested. Roles may have uncommitted local modifications that
    # git rev-parse HEAD would not reflect, producing a SHA that does not
    # accurately describe the exported content.
    #
    # The authoritative record of what was exported is:
    #   1. The role files themselves, copied faithfully by Step 3 (synchronize)
    #   2. The per-file SHA256 checksums in the manifest (Step 9), which cover
    #      every file in the bundle including all role files
    #
    # Per-file checksums at the bundle level provide complete integrity
    # verification without any dependency on git history or commit state.

    # ── Step 9: Compute checksums and write manifest ────────────────────────

    - name: "Step 9 — Find all bundle files for checksumming"
      ansible.builtin.find:
        paths: "{{ _bundle_dir }}"
        recurse: true
        file_type: file
      register: _bundle_files

    - name: "Step 9 — Compute SHA256 checksums"
      ansible.builtin.stat:
        path: "{{ item.path }}"
        checksum_algorithm: sha256
        get_checksum: true
      loop: "{{ _bundle_files.files }}"
      loop_control:
        label: "{{ item.path | replace(_bundle_dir + '/', '') }}"
      register: _checksums

    - name: "Step 9 — Write rhis_disconnected_manifest.yml"
      ansible.builtin.template:
        src: "rhis_disconnected_manifest.yml.j2"
        dest: "{{ _bundle_dir }}/rhis_disconnected_manifest.yml"
        mode: "0644"
        owner: "ansiblerunner"
        group: "ansiblerunner"
      vars:
        _manifest_timestamp: "{{ ansible_date_time.iso8601 }}"
        _satellite_fqdn: "{{ ansible_fqdn }}"
        _satellite_version: "{{ ansible_local.foreman.server.version | default('unknown') }}"
        _manifest_list: "{{ _manifests.files | map(attribute='path') | map('basename') | list }}"
        _checksum_results: "{{ _checksums.results }}"
        _bundle_path: "{{ _bundle_dir }}"
        _pulp_path: "{{ _pulp_export_root }}"

    # ── Step 10: Write operator checklist ──────────────────────────────────

    - name: "Step 10 — Write pre-transfer checklist"
      ansible.builtin.template:
        src: "rhis_export_checklist.md.j2"
        dest: "{{ _bundle_dir }}/RHIS_Export_Checklist_{{ _bundle_timestamp }}.md"
        mode: "0644"
        owner: "ansiblerunner"
        group: "ansiblerunner"
      vars:
        _manifest_list: "{{ _manifests.files | map(attribute='path') | map('basename') | list }}"
        _discovery_count: "{{ _discovery_images.files | length }}"
        _bundle_path: "{{ _bundle_dir }}"
        _pulp_path: "{{ _pulp_export_root }}"
        _export_timestamp: "{{ ansible_date_time.iso8601 }}"
        _satellite_fqdn: "{{ ansible_fqdn }}"

- name: "Unmount transfer drive — runs whether export succeeded or failed"
  hosts: sat_primary
  become: true
  gather_facts: false

  tasks:

    - name: "Load vault variables"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"
      tags: always

    - name: "Unmount transfer drive"
      ansible.builtin.import_role:
        name: content_export_prepare_drv
      vars:
        content_export_prepare_drv_state: "absent"
      tags:
        - tags_export_drive
        - tags_content_exports

    - name: "Transfer drive cleanup complete"
      ansible.builtin.debug:
        msg:
          - "Transfer drive unmounted or was not mounted — satellite is clean."
          - "The drive may now be safely removed and transferred to the highside."

---

# On a connected satellite, roles are cloned/updated from the upstream git repos below.
# On a disconnected satellite, roles arrive via the transfer bundle — bundle_delivery
# installs them to /etc/ansible/roles/ before main.yml runs. The git clone loop is
# skipped by default on disconnected builds.
# Set satellite_imported_git_repos_override: true to enable cloning from a highside
# git server when one is available (e.g. Gitea running on the provisioner node).

- name: "Configure the git repos to replicate"
  when:
    - not (satellite_disconnected | default(false)) or (satellite_imported_git_repos_override | default(false))
    - git_repos is defined
    - git_repos | length > 0
  ansible.builtin.include_tasks: "ensure_clone_git_repos.yml"
  loop: "{{ git_repos }}"
  loop_control:
    loop_var: gitrepo
  no_log: true
  tags:
    - tags_provisioning_config
    - tags_import_git_repos

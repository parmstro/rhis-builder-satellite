---

# Export the Satellite Library for the organization

# Pre-export check: a library export includes ALL repositories in the organization.
# Any repository not set to immediate will produce an export archive with complete
# repodata XML but missing RPM artifacts — silent failure surfacing only when clients
# on the highside try to install packages.
# Note: 'download_policy' (immediate/on_demand) and 'mirroring_policy' (mirror_complete/additive)
# are distinct Pulp concepts. download_policy controls when artifacts are fetched from CDN;
# mirroring_policy controls whether upstream deletions propagate locally. Only download_policy
# affects export completeness. The resource_info index response omits download_policy — this
# should be fixed upstream in foreman-ansible-modules.
- name: "Pre-export check — Query all repos with non-immediate download policy"
  redhat.satellite.resource_info:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    resource: repositories
    search: "download_policy != immediate"
  register: _non_immediate_repos
  tags:
    - tags_content_config
    - tags_content_exports
    - tags_library_exports

- name: "Pre-export check — Fail if any repos are not immediate"
  ansible.builtin.fail:
    msg: >-
      Library export aborted: {{ _non_immediate_repos.resources | length }}
      repositor{{ 'y' if _non_immediate_repos.resources | length == 1 else 'ies' }}
      in organization '{{ satellite_organization }}'
      {{ 'is' if _non_immediate_repos.resources | length == 1 else 'are' }}
      not set to immediate download policy. Set all repositories to immediate
      in repositories.yml, re-sync, then re-run the export.
      Affected: {{ _non_immediate_repos.resources | map(attribute='name') | list | join(', ') }}
  when: _non_immediate_repos.resources | length > 0
  tags:
    - tags_content_config
    - tags_content_exports
    - tags_library_exports

- name: "Performing library export {{ content_export.name }}" # noqa: name[template]
  redhat.satellite.content_export_library:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    ca_path: "{{ content_export.ca_path | default(omit) }}"
    chunk_size_gb: "{{ content_export.chunk_size_gb | default(omit) }}"
    destination_server: "{{ content_export.destination_server | default(omit) }}"
    fail_on_missing_content: "{{ content_export.fail_on_missing_content | default(omit) }}"
    format: "{{ content_export.format | default(omit) }}"
    from_history_id: "{{ content_export.from_history_id | default(omit) }}"
    incremental: "{{ content_export.incremental | default(omit) }}"
  register: export_result
  tags:
    - tags_content_config
    - tags_content_exports
    - tags_library_exports

- name: "Log the export result info"
  ansible.builtin.debug:
    var: export_result.task.output.export_history_id
  tags:
    - tags_content_config
    - tags_content_exports
    - tags_library_exports

- name: "Export the metadata.json file"
  ansible.builtin.command: "hammer content-export generate-metadata --id {{ export_result.task.output.export_history_id }}"
  register: export_metadata_result
  changed_when: export_metadata_result.rc == 0
  tags:
    - tags_content_config
    - tags_content_exports
    - tags_library_exports

- name: "Write out the configuration for import"
  ansible.builtin.include_tasks: "generate_content_imports_file.yml"
  tags:
    - tags_content_config
    - tags_content_exports
    - tags_library_exports

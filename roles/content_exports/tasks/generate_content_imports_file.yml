---

# This task will generate a content_imports.yml file containing a timestamp for use with
# rhis-provisioner container and the downstream disconnected satellite configuration
# Currently if you are performing multiple imports, you may need to manually merge the dictionaries
# we are going to append the existing export operations to any existing content_imports dictionary
# and then re-write the file. So if there is stuff there, it will persist, if there is another file
# somewhere, you will need to replace it or merge it.
# by default we will write out the file to host_vars/{{ ansible_fqdn }}/content_imports.yml

# Retrieve the export path from the Satellite API using the export history ID.
# Different export types (library, cv_version, repository) write to different
# path structures — querying the API by history ID gives the correct path
# regardless of type.

- name: "Get export path from Satellite API"
  redhat.satellite.resource_info:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    resource: content_exports
    search: "id = {{ export_result.task.output.export_history_id }}"
  register: _export_history  # noqa var-naming[no-role-prefix]
  tags:
    - tags_content_config
    - tags_content_exports

- name: "Set export path fact"
  ansible.builtin.set_fact:
    _export_path: "{{ _export_history.resources[0].path }}" # noqa var-naming[no-role-prefix]
  tags:
    - tags_content_config
    - tags_content_exports

# Reset content_imports to an empty list before building it.
# vars_dir loading may pre-populate content_imports from a host_vars file (e.g.
# satellite/content_imports.yml). Without this reset, the template would iterate
# over stale pre-loaded items that lack the 'type' key and fail.
- name: "Reset content_imports to empty list for this export"
  ansible.builtin.set_fact:
    content_imports: [] # noqa var-naming[no-role-prefix]
  tags:
    - tags_content_config
    - tags_content_exports

# Build the dict in a single task with direct assignment — NOT with a loop and combine().
# Ansible's set_fact + combine() in a loop silently drops keys due to variable
# scoping behaviour across iterations. Direct assignment is unambiguous and atomic.
# We are taking the path that Satellite provided and mapping to the corresponding import path and metadata file path for the content_imports.yml structure.
# The highside operator will have a functioning import path without needing to reconfigure.
- name: "Create the content_import dictionary item"
  ansible.builtin.set_fact:
    content_import_dict: # noqa var-naming[no-role-prefix]
      name: "{{ content_export.name }}"
      type: "{{ content_export.type }}"
      import_path: "{{ _export_path | replace('/var/lib/pulp/exports/', '/var/lib/pulp/imports/') }}"
      metadata_file: "{{ _export_path | replace('/var/lib/pulp/exports/', '/var/lib/pulp/imports/') }}/metadata.json"
  tags:
    - tags_content_config
    - tags_content_exports

- name: "Append the content_import item to content_imports list"
  ansible.builtin.set_fact:
    content_imports: "{{ content_imports | default([]) + [content_import_dict] }}" # noqa var-naming[no-role-prefix]
  tags:
    - tags_content_config
    - tags_content_exports

- name: "Update the timestamp value"
  ansible.builtin.set_fact:
    generation_datetime: "{{ ansible_date_time.iso8601 }}" # noqa var-naming[no-role-prefix]
  tags:
    - tags_content_config
    - tags_content_exports

- name: "Write content_imports.yml to highside deployment host_vars"
  ansible.builtin.template:
    src: "content_imports.j2"
    dest: "/rhis/vars/highside_host_vars/satellite1.{{ active_downstream_deployment }}/content_imports.yml"
    mode: "0644"
  delegate_to: localhost
  connection: local
  tags:
    - tags_content_config
    - tags_content_exports

---

# This role implements content imports for Organizations within Satellite
# define a content_imports entity in the host_vars directory for your satellite,
# see host_vars/satellite.example.ca/content_imports.yml


- ansible.builtin.set_fact:  # noqa name[missing]
    _start_time: "{{ ansible_date_time.iso8601 }}" # noqa var-naming[no-role-prefix]
  tags:
    - tags_content_config
    - tags_content_imports

# ── Finalize bundle staging (disconnected builds only) ────────────────────────
# When bundle_delivery staged Pulp chunks to satellite_bundle_stage_path before
# the satellite installer ran, move them now to /var/lib/pulp/imports/ where Pulp
# expects them. The pulp user and pulpcore_var_lib_t SELinux context now exist.
# ensure_content_import.yml sets correct ownership/SELinux on the import_path dirs.
#
# /var/satellite_stage and /var/lib/pulp are on the same filesystem so mv is atomic
# (instant, no extra disk space vs 1x-export-size for rsync).

- name: "Check if Pulp staging path exists"
  when: satellite_bundle_stage_path is defined and satellite_bundle_stage_path | length > 0
  ansible.builtin.stat:
    path: "{{ satellite_bundle_stage_path }}"
  register: _ci_stage_stat # noqa var-naming[no-role-prefix]
  become: true
  tags:
    - tags_content_config
    - tags_content_imports

- name: "List staged Pulp org directories"
  when:
    - satellite_bundle_stage_path is defined and satellite_bundle_stage_path | length > 0
    - _ci_stage_stat.stat.exists | default(false)
  ansible.builtin.find:
    paths: "{{ satellite_bundle_stage_path }}"
    file_type: directory
  register: _ci_staged_dirs # noqa var-naming[no-role-prefix]
  become: true
  tags:
    - tags_content_config
    - tags_content_imports

- name: "Move staged Pulp org dirs to import path (atomic rename — same filesystem)"
  when:
    - satellite_bundle_stage_path is defined and satellite_bundle_stage_path | length > 0
    - _ci_staged_dirs.files | length > 0
  ansible.builtin.command:
    cmd: "mv {{ _ci_staged_dir.path }} /var/lib/pulp/imports/"
  loop: "{{ _ci_staged_dirs.files }}"
  loop_control:
    loop_var: _ci_staged_dir
  become: true
  changed_when: true
  tags:
    - tags_content_config
    - tags_content_imports

- name: "Remove empty Pulp staging directory"
  when: satellite_bundle_stage_path is defined and satellite_bundle_stage_path | length > 0
  ansible.builtin.file:
    path: "{{ satellite_bundle_stage_path }}"
    state: absent
  become: true
  tags:
    - tags_content_config
    - tags_content_imports

- name: "Log the start time of the operation"
  ansible.builtin.debug:
    var: _start_time
  tags:
    - tags_content_config
    - tags_content_imports

- name: "Perform the content_imports"
  when: content_imports is defined and (content_imports | length) > 0
  ansible.builtin.include_tasks: "ensure_content_import.yml"
  loop: "{{ content_imports }}"
  loop_control:
    loop_var: content_import
  no_log: true
  tags:
    - tags_content_config
    - tags_content_imports

- ansible.builtin.set_fact:  # noqa name[missing]
    _end_time: "{{ ansible_date_time.iso8601 }}" # noqa var-naming[no-role-prefix]
  tags:
    - tags_content_config
    - tags_content_imports

- name: "Log the start time of the operation"
  ansible.builtin.debug:
    var: _end_time
  tags:
    - tags_content_config
    - tags_content_imports

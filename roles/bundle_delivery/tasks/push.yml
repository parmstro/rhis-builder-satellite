---
# Push delivery: bundle content lives on the provisioner (Ansible controller).
#   virtual_disk — operator attached a disk image to the provisioner VM;
#                  bash mounted it at bundle_delivery_source_path before this role runs.
#   rsync        — operator rsync'd the USB drive contents to bundle_delivery_source_path
#                  over the highside network; no disk attachment needed.
#
# C3 layout at bundle_delivery_source_path:
#   satellite/        — ansible_roles/, discovery_images/
#   provisioner/      — containers/, inventory/
#   bootstrap/        — bootstrap_isos/, infra_isos/, rhis-builder-bootstrap-init/
#   <pulp_org>/       — Pulp export chunks (virtual_disk only; not present for rsync)
#   rhis_export_manifest.yml
#
# Two-step data movement (required because ansible.posix.synchronize does not honour
# become — it uses the SSH connection user):
#
#   Step 1: SSH push (no root) from provisioner → bundle_delivery_incoming_path on satellite.
#           incoming_path is created as ansiblerunner-owned so the SSH user can write there.
#
#   Step 2: Root mv on satellite moves:
#           - satellite/ subdir → bundle_delivery_stage_path/satellite/
#           - <pulp_org>/ subdir → bundle_delivery_pulp_stage_path/<pulp_org>/ (virtual_disk only)
#           incoming_path is removed to recover space.
#
# Space requirement on /var of the highside satellite:
#   1x satellite/ artifacts (stage_path/satellite/, permanent — roles, discovery images)
#   1x Pulp export size (incoming_path, temporary — virtual_disk only; rsync skips Pulp here)
#   1x Pulp export size (pulp_stage_path, permanent until content_imports runs)

- name: "Assert source path is set"
  ansible.builtin.assert:
    that:
      - bundle_delivery_source_path is defined
      - bundle_delivery_source_path | length > 0
    fail_msg: >
      bundle_delivery_source_path must be set for {{ bundle_delivery_method }} delivery.
      Set it to the mount point of the attached disk (virtual_disk) or the directory
      where the operator rsync'd the bundle (rsync).
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Verify source path exists on provisioner"
  ansible.builtin.stat:
    path: "{{ bundle_delivery_source_path }}"
  register: _bd_source_stat
  delegate_to: localhost
  connection: local
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Assert source path exists"
  ansible.builtin.assert:
    that: _bd_source_stat.stat.exists and _bd_source_stat.stat.isdir
    fail_msg: >
      Source path not found on provisioner: {{ bundle_delivery_source_path }}
      For virtual_disk: ensure the disk image is mounted before running this playbook.
      For rsync: ensure the operator has completed the rsync to this path.
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

# ── Read manifest to identify Pulp org dir ────────────────────────────────────

- name: "Read bundle manifest from source path"
  ansible.builtin.slurp:
    src: "{{ bundle_delivery_source_path }}/rhis_export_manifest.yml"
  register: _bd_manifest_slurp
  delegate_to: localhost
  connection: local
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Set Pulp org dir from manifest"
  ansible.builtin.set_fact:
    _bd_pulp_export_path: "{{ (_bd_manifest_slurp.content | b64decode | from_yaml).pulp_export_path | default('') }}"
    _bd_pulp_org_dir: "{{ ((_bd_manifest_slurp.content | b64decode | from_yaml).pulp_export_path | default(''))
                          | regex_replace('^/var/lib/pulp/exports/([^/]+)/.*$', '\\1') }}"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Display push delivery plan"
  ansible.builtin.debug:
    msg:
      - "Method:      {{ bundle_delivery_method }}"
      - "Source:      {{ bundle_delivery_source_path }}"
      - "Pulp org:    {{ _bd_pulp_org_dir }}"
      - "Incoming:    {{ bundle_delivery_incoming_path }}"
      - "Pulp stage:  {{ bundle_delivery_pulp_stage_path }}/{{ _bd_pulp_org_dir }}"
      - "Artifacts:   {{ bundle_delivery_stage_path }}/satellite"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

# ── Step 1: Prepare satellite-side paths ───────────────────────────────────────

- name: "Ensure incoming staging directory exists (ansiblerunner-writable)"
  ansible.builtin.file:
    path: "{{ bundle_delivery_incoming_path }}"
    state: directory
    owner: ansiblerunner
    group: ansiblerunner
    mode: "0755"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Ensure satellite artifact staging dir exists"
  ansible.builtin.file:
    path: "{{ bundle_delivery_stage_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Ensure Pulp pre-installer staging dir exists"
  ansible.builtin.file:
    path: "{{ bundle_delivery_pulp_stage_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

# ── Step 2: SSH push from provisioner to satellite incoming dir ────────────────
# ansible.posix.synchronize does not honour become — files arrive owned by the
# SSH user (ansiblerunner). The incoming_path is ansiblerunner-owned to allow this.
#
# Only push what the satellite actually needs:
#   rsync        — satellite/ and manifest only (Pulp went directly from workstation)
#   virtual_disk — satellite/, manifest, AND the Pulp org dir (everything came via provisioner)
# bootstrap/ (ISOs) and provisioner/ (containers) are NOT pushed — they are not
# needed on the satellite and are very large.

- name: "Set push filter for rsync delivery (satellite artifacts only)"
  when: bundle_delivery_method == 'rsync'
  ansible.builtin.set_fact:
    _bd_push_rsync_opts:
      - "--include=satellite/"
      - "--include=satellite/**"
      - "--include=rhis_export_manifest.yml"
      - "--exclude=*"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Set push filter for virtual_disk delivery (satellite artifacts + Pulp org dir)"
  when: bundle_delivery_method == 'virtual_disk'
  ansible.builtin.set_fact:
    _bd_push_rsync_opts:
      - "--include={{ _bd_pulp_org_dir }}/"
      - "--include={{ _bd_pulp_org_dir }}/**"
      - "--include=satellite/"
      - "--include=satellite/**"
      - "--include=rhis_export_manifest.yml"
      - "--exclude=*"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Push required artifacts from provisioner to satellite incoming dir — Please wait..."
  ansible.posix.synchronize:
    src: "{{ bundle_delivery_source_path }}/"
    dest: "{{ bundle_delivery_incoming_path }}/"
    recursive: true
    delete: false
    mode: push
    rsync_opts: "{{ _bd_push_rsync_opts }}"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

# ── Step 3: Root mv on satellite — stage artifacts and Pulp to correct paths ───
# Pulp org dir moved to pulp_stage_path (virtual_disk only — for rsync it was
# pushed directly to satellite by import_bundle.yml and is not in incoming).
# satellite/ subdir moved to bundle_delivery_stage_path/satellite.

- name: "Check if Pulp org dir is in incoming (virtual_disk delivery)"
  ansible.builtin.stat:
    path: "{{ bundle_delivery_incoming_path }}/{{ _bd_pulp_org_dir }}"
  register: _bd_pulp_in_incoming
  when: _bd_pulp_org_dir | length > 0
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Move Pulp org dir to pre-installer staging path (virtual_disk)"
  when:
    - _bd_pulp_org_dir | length > 0
    - _bd_pulp_in_incoming.stat.exists | default(false)
  ansible.builtin.command:
    cmd: >
      mv {{ bundle_delivery_incoming_path }}/{{ _bd_pulp_org_dir }}
         {{ bundle_delivery_pulp_stage_path }}/{{ _bd_pulp_org_dir }}
  changed_when: true
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Move satellite artifacts to stage path"
  ansible.builtin.command:
    cmd: >
      mv {{ bundle_delivery_incoming_path }}/satellite
         {{ bundle_delivery_stage_path }}/satellite
    creates: "{{ bundle_delivery_stage_path }}/satellite"
  become: true
  changed_when: true
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Move manifest to stage path for validate.yml access"
  ansible.builtin.command:
    cmd: >
      mv {{ bundle_delivery_incoming_path }}/rhis_export_manifest.yml
         {{ bundle_delivery_stage_path }}/rhis_export_manifest.yml
    creates: "{{ bundle_delivery_stage_path }}/rhis_export_manifest.yml"
  become: true
  changed_when: true
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

# ── Step 4: Remove incoming staging area to recover space ─────────────────────

- name: "Install ansible-core (creates /etc/ansible/roles/ with correct ownership)"
  ansible.builtin.package:
    name: ansible-core
    state: present
  become: true
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Install ansible roles to /etc/ansible/roles/"
  ansible.builtin.command:
    cmd: >
      rsync -a {{ bundle_delivery_stage_path }}/satellite/ansible_roles/
            /etc/ansible/roles/
  become: true
  changed_when: true
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

- name: "Remove incoming staging directory"
  ansible.builtin.file:
    path: "{{ bundle_delivery_incoming_path }}"
    state: absent
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

# ── Set output facts for validate.yml and build_sat_disconnected_import.sh ────

- name: "Set bundle delivery path fact"
  ansible.builtin.set_fact:
    bundle_delivery_bundle_path: "{{ bundle_delivery_stage_path }}/satellite"
    _bd_manifest_path: "{{ bundle_delivery_stage_path }}/rhis_export_manifest.yml"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_push

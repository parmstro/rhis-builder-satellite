---
# USB delivery: the transfer drive is physically plugged into the satellite baremetal.
# Discover the drive by label, validate filesystem, mount at a safe pre-installer path.
# Pulp chunks are copied from the drive to bundle_delivery_pulp_stage_path so they
# survive after the drive is removed and are available post-installer for content_imports.
# The drive stays mounted so satellite/ artifacts (ansible_roles, discovery_images)
# are accessible directly during the satellite build.
# pulp user and /var/lib/pulp/imports do not exist until satellite-installer runs.

- name: "Discover transfer drive by label {{ bundle_delivery_drv_label }}"
  ansible.builtin.command:
    cmd: "blkid -L {{ bundle_delivery_drv_label }}"
  register: _bd_drv_discovery
  changed_when: false
  failed_when: >
    _bd_drv_discovery.rc != 0 or
    _bd_drv_discovery.stdout | trim == ""
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Set discovered device fact"
  ansible.builtin.set_fact:
    _bd_drv_device: "{{ _bd_drv_discovery.stdout | trim }}"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Get drive filesystem type"
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ _bd_drv_device }}"
  register: _bd_drv_fstype_raw
  changed_when: false
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Set filesystem type fact"
  ansible.builtin.set_fact:
    _bd_drv_fstype: "{{ _bd_drv_fstype_raw.stdout | trim }}"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Assert supported filesystem"
  ansible.builtin.assert:
    that: _bd_drv_fstype in _bundle_delivery_supported_fstypes
    fail_msg: >
      Transfer drive {{ _bd_drv_device }} has filesystem '{{ _bd_drv_fstype }}'
      which is not supported for import.
      Supported filesystems: {{ _bundle_delivery_supported_fstypes | join(', ') }}
    success_msg: "Drive filesystem: {{ _bd_drv_fstype }} (supported)"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Get drive UUID"
  ansible.builtin.command:
    cmd: "blkid -o value -s UUID {{ _bd_drv_device }}"
  register: _bd_drv_uuid_raw
  changed_when: false
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Set drive UUID fact"
  ansible.builtin.set_fact:
    _bd_drv_uuid: "{{ _bd_drv_uuid_raw.stdout | trim }}"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Get drive capacity"
  ansible.builtin.command:
    cmd: "blockdev --getsize64 {{ _bd_drv_device }}"
  register: _bd_drv_size_raw
  changed_when: false
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Display discovered drive"
  ansible.builtin.debug:
    msg:
      - "Label:    {{ bundle_delivery_drv_label }}"
      - "Device:   {{ _bd_drv_device }}"
      - "UUID:     {{ _bd_drv_uuid }}"
      - "FS type:  {{ _bd_drv_fstype }}"
      - "Capacity: {{ (_bd_drv_size_raw.stdout | trim | int / 1073741824) | round(2) }} GiB"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Check if mount point is already in use: {{ bundle_delivery_usb_mount_path }}"
  ansible.builtin.command:
    cmd: "findmnt -n -o SOURCE {{ bundle_delivery_usb_mount_path }}"
  register: _bd_mount_check
  changed_when: false
  failed_when: false
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Ensure USB mount point exists"
  ansible.builtin.file:
    path: "{{ bundle_delivery_usb_mount_path }}"
    state: directory
    mode: "{{ _bundle_delivery_mount_mode }}"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Mount transfer drive at {{ bundle_delivery_usb_mount_path }}"  # noqa command-instead-of-module
  when: _bd_mount_check.rc != 0
  ansible.builtin.command:
    cmd: >
      mount -t {{ _bd_drv_fstype }}
      -o {{ _bundle_delivery_mount_opts }}
      /dev/disk/by-uuid/{{ _bd_drv_uuid }}
      {{ bundle_delivery_usb_mount_path }}
  changed_when: true
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Verify mount point is active"
  ansible.builtin.command:
    cmd: "mountpoint -q {{ bundle_delivery_usb_mount_path }}"
  changed_when: false
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

# ── Read manifest to identify Pulp org dir ────────────────────────────────────

- name: "Read bundle manifest from drive"
  ansible.builtin.slurp:
    src: "{{ bundle_delivery_usb_mount_path }}/rhis_export_manifest.yml"
  register: _bd_manifest_slurp
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Set Pulp org dir from manifest"
  ansible.builtin.set_fact:
    _bd_pulp_export_path: "{{ (_bd_manifest_slurp.content | b64decode | from_yaml).pulp_export_path | default('') }}"
    _bd_pulp_org_dir: "{{ ((_bd_manifest_slurp.content | b64decode | from_yaml).pulp_export_path | default(''))
                          | regex_replace('^/var/lib/pulp/exports/([^/]+)/.*$', '\\1') }}"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Assert Pulp org dir was found in manifest"
  ansible.builtin.assert:
    that:
      - _bd_pulp_org_dir | length > 0
      - _bd_pulp_org_dir != _bd_pulp_export_path
    fail_msg: >
      Pulp org directory could not be determined from rhis_export_manifest.yml on the drive.
      pulp_export_path in the manifest is empty or malformed.
      Ensure the drive was prepared with transfer_to_drive.sh on the lowside.
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Display USB drive and bundle summary"
  ansible.builtin.debug:
    msg:
      - "Device:     {{ _bd_drv_device }}"
      - "UUID:       {{ _bd_drv_uuid }}"
      - "Mount:      {{ bundle_delivery_usb_mount_path }}"
      - "Pulp org:   {{ _bd_pulp_org_dir }}"
      - "Chunks  →   {{ bundle_delivery_pulp_stage_path }}/{{ _bd_pulp_org_dir }}"
      - "Artifacts → {{ bundle_delivery_usb_mount_path }}/satellite (accessed directly from drive)"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

# ── Copy Pulp chunks from drive to pre-installer safe staging path ─────────────
# Chunk directory is the Pulp org dir (e.g. Default_Organization/).
# This copy is required because /var/lib/pulp/imports and the pulp user do not
# exist until satellite-installer runs. content_imports moves them post-installer.
# satellite/ artifacts remain on the drive and are accessed directly.

- name: "Ensure Pulp chunk staging path exists"
  ansible.builtin.file:
    path: "{{ bundle_delivery_pulp_stage_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

- name: "Copy Pulp org dir from drive to staging path — Please wait..."  # noqa command-instead-of-module
  ansible.builtin.command:
    cmd: >
      rsync -a
      {{ bundle_delivery_usb_mount_path }}/{{ _bd_pulp_org_dir }}/
      {{ bundle_delivery_pulp_stage_path }}/{{ _bd_pulp_org_dir }}/
  changed_when: true
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

# ── Set output facts for validate.yml and build_sat_disconnected_import.sh ────

- name: "Set bundle path and manifest path facts"
  ansible.builtin.set_fact:
    bundle_delivery_bundle_path: "{{ bundle_delivery_usb_mount_path }}/satellite"
    _bd_manifest_path: "{{ bundle_delivery_usb_mount_path }}/rhis_export_manifest.yml"
  tags:
    - tags_bundle_delivery
    - tags_bundle_delivery_usb

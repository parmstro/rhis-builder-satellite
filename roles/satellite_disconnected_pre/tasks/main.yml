---

# This role prepares a disconnected satellite for installation

# ── Preflight: IdM DNS resolver check ─────────────────────────────────────────
# If /etc/NetworkManager/conf.d/zzz-ipa.conf exists, the [global-dns-domain-*]
# servers= value must match ipa_client_dns_servers.  Absent file is not an error
# (fresh host before IPA client enrolment); mismatch is a hard failure.

# ── Repo validation ───────────────────────────────────────────────────────────

- name: "Refresh the repos" # noqa var-naming[no-role-prefix]
  ansible.builtin.command: "dnf repolist"
  register: repolist_out
  changed_when: repolist_out.rc == 0
  tags:
    - tags_satellite_pre
    - tags_satellite_before_sync

- name: "Assertion"
  ansible.builtin.assert:
    that:
      - "'rhis-rhel-baseos' in repolist_out.stdout"
      - "'rhis-rhel-appstream' in repolist_out.stdout"
      - "'rhis-satellite' in repolist_out.stdout"
      - "'rhis-satellite-maintenance' in repolist_out.stdout"
  tags:
    - tags_satellite_pre
    - tags_satellite_before_sync

# Update the system based on the current repos
- name: "Update the system" # noqa package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
  tags:
    - tags_satellite_pre
    - tags_satellite_before_sync

# We are done the disconnected pre section
- name: "Disconnected Satellite preparation complete"
  ansible.builtin.assert:
    that: true
  tags:
    - tags_satellite_pre
    - tags_satellite_before_sync

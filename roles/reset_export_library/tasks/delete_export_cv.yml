---

- name: "Find all Export-Library content views (bare and destination_server-slug variants)"
  redhat.satellite.resource_info:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    resource: content_views
    search: "name ~ \"Export-Library\""
  register: _export_cv

- name: "Report Export-Library content view version counts"
  ansible.builtin.debug:
    msg: "Found {{ _export_cv.resources | length }} Export-Library CV(s) to delete"

- name: "Delete Export-Library content view versions"
  redhat.satellite.content_view_version:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    content_view: "{{ item.0.name }}"
    version: "{{ item.1.version }}"
    state: absent
  loop: "{{ _export_cv.resources | subelements('versions') }}"
  loop_control:
    label: "cv={{ item.0.name }} version={{ item.1.version }}"
  failed_when: false

- name: "Delete Export-Library content views"
  redhat.satellite.content_view:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    name: "{{ item.name }}"
    state: absent
  loop: "{{ _export_cv.resources }}"
  loop_control:
    label: "cv={{ item.name }}"

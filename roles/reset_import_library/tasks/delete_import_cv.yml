---

- name: "Query Import-Library content view info"
  redhat.satellite.resource_info:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    resource: content_views
    search: "name = \"Import-Library\""
  register: _import_cv

- name: "Report Import-Library content view version count"
  when: _import_cv.resources | length > 0
  ansible.builtin.debug:
    msg: "Found {{ _import_cv.resources[0].versions | length }} Import-Library version(s) to delete"

- name: "Delete Import-Library content view versions"
  when: _import_cv.resources | length > 0
  redhat.satellite.content_view_version:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    content_view: "Import-Library"
    version: "{{ item.version }}"
    state: absent
  loop: "{{ _import_cv.resources[0].versions }}"
  loop_control:
    label: "version={{ item.version }}"
  failed_when: false

- name: "Delete Import-Library content view"
  when: _import_cv.resources | length > 0
  redhat.satellite.content_view:
    username: "{{ satellite_username | default(omit) }}"
    password: "{{ satellite_password | default(omit) }}"
    use_gssapi: "{{ satellite_use_gssapi | default(omit) }}"
    server_url: "{{ satellite_url }}"
    organization: "{{ satellite_organization }}"
    validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    name: "Import-Library"
    state: absent

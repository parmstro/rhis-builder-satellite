---

# entry point for capsule_post role

- name: "Assign Capsule Organization and Location"
  when: satellite_capsules is defined and (satellite_capsules | length) > 0
  ansible.builtin.include_tasks: "capsule_configure.yml"
  loop: "{{ satellite_capsules }}"
  loop_control:
    loop_var: capsule
  no_log: true

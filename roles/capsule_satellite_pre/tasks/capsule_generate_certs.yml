---
# currently neither the freeipa.ansible_freeipa collection nor the community collection support certificate management with ansible.
# we either resort to the IPA API and a URI object or command line for this functionality
# community certficate commands are not working even with pyOpenSSL > 16.0
# This task assumes the ipa client is installed and configured.

# yamllint disable rule:line-length

- name: "Define the secure directory"
  ansible.builtin.set_fact:
    capsule_crt_dir: "{{ private_crt_dir }}{{ cert_capsule.fqdn }}/"

- name: "Define the capsule_cert_path"
  ansible.builtin.set_fact:
    capsule_crt_path: "{{ capsule_crt_dir }}{{ cert_capsule.fqdn }}.crt"
    capsule_key_path: "{{ capsule_crt_dir }}{{ cert_capsule.fqdn }}.key"
    capsule_csr_path: "{{ capsule_crt_dir }}{{ cert_capsule.fqdn }}.csr"
    capsule_private_key_pem_path: "{{ capsule_crt_dir }}{{ cert_capsule.fqdn }}.pem"
    capsule_ca_crt_path: "{{ capsule_crt_dir }}{{ cert_capsule.fqdn }}.CA.crt"

- name: "Debug output - generating certificates"
  ansible.builtin.debug:
    var: debug_vars
  vars:
    debug_vars:
      capsule_crt_dir
      capsule_crt_path
      capsule_key_path
      capsule_csr_path
      capsule_private_key_pem_path
      capsule_ca_crt_path

- name: "Create a secure directory"
  ansible.builtin.file:
    path: "{{ capsule_crt_dir }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0600"
    seuser: "system_u"
    serole: "object_r"
    setype: "cert_t"
    selevel: "s0"
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "Copy IdM CA crt for use with Satellite Capsules"
  ansible.builtin.copy:
    src: "{{ ipa_server_ca_crt_path }}"
    dest: "{{ capsule_ca_crt_path }}"
    owner: "root"
    group: "root"
    mode: "0600"
    remote_src: true
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "Authenticate with IdM" # noqa: command-instead-of-shell risky-shell-pipe
  ansible.builtin.shell: "ipa-getkeytab -p {{ ipa_admin_principal }} -s {{ ipaserver_fqdn }} -r -k {{ capsule_crt_dir }}local.keytab -D '{{ keytab_retrieval_dn }}' -w '{{ keytab_retrieval_password }}'" # noqa: yaml[line-length]
  register: gc_get_keytab
  changed_when: gc_get_keytab.rc == 0
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "Determine if the private key file exists"
  ansible.builtin.stat:
    path: "{{ capsule_private_key_pem_path }}"
  register: gc_pk_stat
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "If the key exists, determine if we can decrypt the key."
  when: gc_pk_stat.stat.exists
  block:
    - name: "Generate configuration files"
      ansible.builtin.lineinfile:
        path: "{{ passfile }}"
        state: present
        create: true
        line: "{{ capsule_ssl_rsa_key_pass }}"
        owner: "root"
        mode: "0740"
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Try to access the existing key"
      ansible.builtin.shell: "openssl pkey -in '{{ capsule_private_key_pem_path }}' -noout -passin 'file:{{ passfile }}'" # noqa command-instead-of-shell
      register: gc_pk_access_result
      changed_when: true
      tags:
        - tags_capsule
        - tags_capsule_pre

    # if we can't access the file, something has changed and we need to clean up
    - name: "Changed: Configuration clean up"
      when: gc_pk_access_result.rc > 0
      ansible.builtin.file:
        path: "{{ capsule_private_key_pem_path }}"
        state: absent
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Changed: Configuration clean up"
      when: gc_pk_access_result.rc > 0
      ansible.builtin.file:
        path: "{{ capsule_key_path }}"
        state: absent
      tags:
        - tags_capsule
        - tags_capsule_pre

# OK... now check if the private key still exists
- name: "Determine if the private key file exists"
  ansible.builtin.stat:
    path: "{{ capsule_private_key_pem_path }}"
  register: gc_pk_stat2
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "Create a new configuration"
  when: not gc_pk_stat2.stat.exists
  block:

    - name: "Generate configuration files"
      ansible.builtin.lineinfile:
        path: "{{ passfile }}"
        state: present
        create: true
        line: "{{ capsule_ssl_rsa_key_pass }}"
        owner: "root"
        mode: "0740"
      tags:
        - tags_capsule
        - tags_capsule_pre

    - ansible.builtin.command: "openssl genrsa -{{ ssl_private_key_cipher }} -out {{ ssl_private_key_pem_path }} -passout file:/{{ passfile }} {{ ssl_private_key_size }}" # noqa: name[missing]
      register: gc_gen_key_result
      changed_when: gc_gen_key_result.rc == 0
      tags:
        - tags_capsule
        - tags_capsule_pre

    - ansible.builtin.command: "openssl rsa -in {{ ssl_private_key_pem_path }} -out {{ capsule_key_path }} -passin file:/{{ passfile }}" # noqa: name[missing]
      register: gc_gen_key_result
      changed_when: gc_gen_key_result.rc == 0
      tags:
        - tags_capsule
        - tags_capsule_pre

# At this point we have a valid private key file

- name: "Set target service name"
  ansible.builtin.set_fact:
    target_service: "{{ crt_service_type }}/{{ cert_capsule.fqdn }}"
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "Ensure target service is present"
  redhat.rhel_idm.ipaservice:
    ipaadmin_principal: "{{ ipa_admin_principal }}"
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "{{ target_service }}"
    allow_create_keytab_host:
      - "{{ ansible_fqdn }}"
    allow_retrieve_keytab_host:
      - "{{ ansible_fqdn }}"
  register: ts_result
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "Check for an existing certificate file"
  ansible.builtin.stat:
    path: "{{ capsule_crt_path }}"
  register: cert_exists
  tags:
    - tags_capsule
    - tags_capsule_pre

- name: "Cert exists and regen requested - stop tracking and clean up"
  when: cert_exists.stat.exists and cert_capsule.crt_force_regen
  block:
    - name: "Read existing cert" # noqa: no-changed-when command-instead-of-module
      ansible.builtin.shell: "sed -n 2,$(expr $(wc -l < {{ capsule_crt_path }}) - 1)p {{ capsule_crt_path }}"
      register: cert
      changed_when: cert.rc == 0
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Get cert serial number"  # noqa: no-changed-when risky-shell-pipe
      ansible.builtin.shell: "kinit -kt {{ capsule_crt_dir }}local.keytab {{ ipa_admin_principal }}; ipa cert-find --certificate='{{ cert.stdout }}' --subject={{ ansible_fqdn }} | grep 'Serial number:' | cut -c18-"
      register: serial_number
      changed_when: serial_number.rc == 0
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Debug"
      ansible.builtin.debug:
        var: serial_number
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Stop tracking cert with certmonger" # noqa: no-changed-when risky-shell-pipe ignore-errors
      ansible.builtin.shell: "kinit -kt {{ capsule_crt_dir }}local.keytab {{ ipa_admin_principal }}; ipa-getcert stop-tracking -k {{ capsule_key_path }} -f {{ capsule_crt_path }} -i {{ cert_capsule.fqdn }}" # noqa: yaml[line-length]
      register: gc_stop_tracking_result
      changed_when: gc_stop_tracking_result.rc == 0
      failed_when:
        - gc_stop_tracking_result.rc != 0
        - ('No request found' not in gc_stop_tracking_result.stdout)
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Debug"
      ansible.builtin.debug:
        var: gc_stop_tracking_result
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Remove the old cert from the service"
      redhat.rhel_idm.ipaservice:
        ipaadmin_principal: "{{ ipa_admin_principal }}"
        ipaadmin_password: "{{ ipa_admin_password }}"
        name: "{{ target_service }}"
        certificate: "{{ cert.stdout }}"
        action: member
        state: absent
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Revoke the old cert with reason 4 - certificateSuperceded."
      when: serial_number is defined and (serial_number.stdout_lines | length) == 1
      redhat.rhel_idm.ipacert:
        ipaadmin_principal: "{{ ipa_admin_principal }}"
        ipaadmin_password: "{{ ipa_admin_password }}"
        state: "revoked"
        serial_number: "{{ serial_number.stdout }}"
        reason: "superseded"
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Cert exists, rename old cert .revoked"
      ansible.builtin.copy:
        src: "{{ capsule_crt_path }}"
        dest: "{{ capsule_crt_path }}.revoked"
        remote_src: true
        owner: root
        group: root
        mode: "0640"
      tags:
        - tags_capsule
        - tags_capsule_pre

- name: Generating New Certificate
  when: not cert_exists.stat.exists or cert_capsule.crt_force_regen
  block:

    - name: "Generate configuration files"
      ansible.builtin.lineinfile:
        path: "{{ passfile }}"
        state: present
        create: true
        line: "{{ capsule_ssl_rsa_key_pass }}"
        owner: "root"
        mode: "0740"
      tags:
        - tags_capsule
        - tags_capsule_pre

    - ansible.builtin.command: "openssl genrsa -{{ ssl_private_key_cipher }} -out {{ capsule_private_key_pem_path }} -passout file:/{{ passfile }} {{ ssl_private_key_size }}" # noqa: yaml[line-length] name[missing] no-changed-when
      register: gc_gen_key_result
      changed_when: gc_gen_key_result.rc ==0
      tags:
        - tags_capsule
        - tags_capsule_pre

    - ansible.builtin.command: "openssl rsa -in {{ capsule_private_key_pem_path }} -out {{ capsule_key_path }} -passin file:/{{ passfile }}" # noqa: yaml[line-length] name[missing] no-changed-when
      register: gc_gen_key_result
      changed_when: gc_gen_key_result.rc ==0
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Create request"
      ansible.builtin.command: "openssl req -new -key {{ capsule_key_path }} -out {{ capsule_csr_path }} -subj \"/C={{ csr_country_name }}/ST={{ csr_state_or_province_name }}/L={{ csr_locality_name }}/O={{ csr_organization_name }}/OU={{ csr_organization_unit_name }}/CN={{ cert_capsule.fqdn }}/subjectAltName=DNS.1={{ cert_capsule.fqdn }}\"" # noqa: yaml[line-length] name[missing] no-changed-when
      register: gc_gen_csr_result
      changed_when: gc_gen_csr_result.rc ==0
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Generate the certificate for the service"
      ansible.builtin.shell: "kinit -kt {{ capsule_crt_dir }}local.keytab {{ ipa_admin_principal }}; ipa cert-request --add --principal={{ target_service }} {{ capsule_csr_path }} --certificate-out={{ capsule_crt_path }}" # noqa: yaml[line-length] risky-shell-pipe no-changed-when
      register: gc_gen_crt_result
      changed_when: gc_gen_crt_result.rc ==0
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: "Ensure that certmonger starts-tracking the new certificate for autorenewals"
      ansible.builtin.shell: "kinit -kt {{ capsule_crt_dir }}local.keytab {{ ipa_admin_principal }}; ipa-getcert start-tracking -k {{ capsule_key_path }} -f {{ capsule_crt_path }} -I {{ cert_capsule.fqdn }}" # noqa: yaml[line-length] risky-shell-pipe no-changed-when
      register: gc_start_tracking_result
      changed_when: gc_start_tracking_result.rc ==0
      tags:
        - tags_capsule
        - tags_capsule_pre


  always:
    - name: Cleanup
      ansible.builtin.file:
        path: "{{ passfile }}"
        state: absent
      tags:
        - tags_capsule
        - tags_capsule_pre

    - name: Cleanup
      ansible.builtin.file:
        path: "{{ capsule_crt_dir }}local.keytab"
        state: absent
      tags:
        - tags_capsule
        - tags_capsule_pre

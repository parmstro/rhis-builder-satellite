---
# Unmount the transfer drive after export is complete.
# No fstab entry was created so there is nothing to clean up —
# simply unmount and the satellite is clean for any reboot.

- name: "Check if {{ content_export_prepare_drv_mount }} is mounted"
  ansible.builtin.command:
    cmd: "findmnt -n -o SOURCE {{ content_export_prepare_drv_mount }}"
  register: _unmount_check
  changed_when: false
  failed_when: false

- name: "Unmount transfer drive"
  when: _unmount_check.rc == 0
  ansible.builtin.command:
    cmd: "umount {{ content_export_prepare_drv_mount }}"
  changed_when: true

- name: "Confirm unmounted"
  when: _unmount_check.rc == 0
  ansible.builtin.debug:
    msg:
      - "Transfer drive unmounted from {{ content_export_prepare_drv_mount }}"
      - "Drive may now be safely removed."

- name: "Drive was not mounted"
  when: _unmount_check.rc != 0
  ansible.builtin.debug:
    msg: "{{ content_export_prepare_drv_mount }} was not mounted — nothing to do"

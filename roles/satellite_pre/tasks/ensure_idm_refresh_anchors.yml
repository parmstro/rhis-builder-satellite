---

- name: "Copy the ipa ca-certificates to the trust directory"
  ansible.builtin.copy:
    src: /etc/ipa/ca.crt
    dest: /etc/pki/ca-trust/source/anchors/ipa.crt
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  tags:
    - tags_satellite_pre
    - tags_satellite_pre_idm_integration
    - tags_satellite_before_sync

- name: "Enable the CA trust" # noqa: no-changed-when risky-shell-pipe # noqa var-naming[no-role-prefix]
  ansible.builtin.command: "update-ca-trust enable"
  register: update_ca_trust_enable_result
  changed_when: update_ca_trust_enable_result.rc == 0
  tags:
    - tags_satellite_pre
    - tags_satellite_pre_idm_integration
    - tags_satellite_before_sync

- name: "Update the CA trust" # noqa: no-changed-when risky-shell-pipe # noqa var-naming[no-role-prefix]
  ansible.builtin.command: "update-ca-trust"
  register: update_ca_trust_result
  changed_when: update_ca_trust_result.rc == 0
  tags:
    - tags_satellite_pre
    - tags_satellite_pre_idm_integration
    - tags_satellite_before_sync

---

# DNS resolver and /etc/hosts for IdM are set at kickstart time via bootstrap_init.
# ipa_client_dns_servers is set centrally in group_vars/all/main.yml.j2 and
# inherited here — no host-level override required.
# Adding entries here creates duplicates on re-runs; trust the kickstart DNS.

# role will install client
- name: "Ensure the client configuration"
  ansible.builtin.include_role:
    name: "redhat.rhel_idm.ipaclient"
  tags:
    - tags_satellite_pre
    - tags_satellite_pre_idm_integration
    - tags_satellite_before_sync

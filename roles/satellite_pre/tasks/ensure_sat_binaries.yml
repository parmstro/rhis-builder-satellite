---

# we are patching the system so ya, latest is required
# patch only when satellite-installer has not been run
- name: "Set _satpre_satellite_installed to false" # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    _satpre_satellite_installed: false
  tags:
    - tags_satellite_pre
    - tags_satellite_before_sync

- name: "Is satellite installed?"
  ansible.builtin.include_tasks: "is_satellite_installed.yml"
  # sets _satpre_satellite_installed: true when installed
  tags:
    - tags_satellite_pre

- name: "Update the system"
  when: not _satpre_satellite_installed
  block:
    - name: "Patch the system using dnf" # noqa: package-latest # noqa var-naming[no-role-prefix]
      ansible.builtin.dnf:
        name: '*'
        state: latest
      async: "{{ satellite_async_timeout }}"
      poll: 0
      register: async_update
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Check on system update" # noqa var-naming[no-role-prefix]
      ansible.builtin.async_status:
        jid: "{{ async_update.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: "{{ (satellite_async_timeout / satellite_async_delay) | int }}"
      delay: "{{ satellite_async_delay }}"
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Ensure ansible-core"
      ansible.builtin.dnf:
        name: "ansible-core"
        state: present
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Ensure ansible collections in global configuration"
      when: not satellite_disconnected
      community.general.ansible_galaxy_install:
        type: collection
        name: "{{ collection_name }}"
        dest: "/usr/share/ansible/collections"
        force: true
      loop:
        - "community.general"
        - "ansible.posix"
      loop_control:
        loop_var: collection_name
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Reset the Ruby module" # noqa: no-changed-when
      ansible.builtin.command: "dnf -y module reset ruby"
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Reset the PostgreSQL module" # noqa: no-changed-when
      ansible.builtin.command: "dnf -y module reset postgresql"
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Reset the Satellite module" # noqa: no-changed-when
      when: ansible_distribution_major_version == 8
      ansible.builtin.command: "dnf -y module reset satellite:el8"
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Enable the Satellite module" # noqa: no-changed-when
      when: ansible_distribution_major_version == 8
      ansible.builtin.command: "dnf -y module enable satellite:el8"
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Install the Satellite RPM packages" # noqa var-naming[no-role-prefix]
      ansible.builtin.dnf:
        name: satellite
        state: present
      async: "{{ satellite_async_timeout }}"
      poll: 0
      register: async_update
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

    - name: "Wait for Satellite binary install to complete" # noqa var-naming[no-role-prefix]
      ansible.builtin.async_status:
        jid: "{{ async_update.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: "{{ (satellite_async_timeout / satellite_async_delay) | int }}"
      delay: "{{ satellite_async_delay }}"
      tags:
        - tags_satellite_pre
        - tags_satellite_before_sync

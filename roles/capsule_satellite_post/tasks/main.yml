---

# Core task is to update the trusted hosts on the Satellite 
# to ensure provisioning works appropriately

- name: "Ensure Satellite Primary and All Capsules are trusted hosts"
  ansible.builtin.set_fact:
    trusted_hosts: "{{ groups['sat_trusted_hosts'] | join(',') }}"

- name: "Validate List"
  ansible.builtin.debug:
    var: trusted_hosts

- name: "Update the Satellite configuration using the installer"
  ansible.builtin.import_role:
    name: "redhat.satellite_operations.installer"
  vars:
    satellite_installer_scenario: "satellite"                   # noqa: var-naming[no-role-prefix]
    satellite_installer_options:
      - '--foreman-proxy-trusted-hosts "{{ trusted_hosts }}"'

